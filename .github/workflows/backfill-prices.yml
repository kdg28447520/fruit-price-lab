name: Backfill one year of official fruit price history
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-prices.mjs'
      - '.github/workflows/backfill-prices.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: annual-fruit-price-backfill
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Backfill actual observed day prices, 365-day range
        run: node scripts/backfill-prices.mjs
      - name: Save completed snapshots and progress
        if: always()
        run: |
          git config user.name "fruit-price-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/ data/backfill-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill official historical produce prices"
            git pull --rebase
            git push
          fi
