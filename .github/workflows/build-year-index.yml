name: Build one-year priced variety index
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-year-index.mjs'
      - '.github/workflows/build-year-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fruit-year-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build-year-index.mjs
      - name: Publish actual priced varieties
        run: |
          git config user.name "fruit-price-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/year-index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish year of actual fruit variety prices"
            git pull --rebase
            git push
          fi
