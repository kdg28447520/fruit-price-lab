name: Build Open Graph thumbnail
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-og.py'
      - '.github/workflows/generate-og.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fruit-lab-og-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install image and Korean text dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Generate exact 1200 by 630 OG JPEG
        run: python scripts/generate-og.py
      - name: Commit thumbnail
        run: |
          git config user.name "fruit-design-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/og-image.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish 1200x630 fruit price lab OG preview"
            git pull --rebase
            git push
          fi
