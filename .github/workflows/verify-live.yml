name: Verify live fruit lab
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live.yml'
      - 'scripts/check-live.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/check-live.cjs
      - name: Publish live checks
        if: always()
        run: |
          if [ -f data/live-check-report.json ]; then
            git config user.name "fruit-qa-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/live-check-report.json
            if ! git diff --cached --quiet; then
              git commit -m "qa: record live web and image smoke tests"
              git pull --rebase
              git push
            fi
          fi
