name: Verify fruit lab menus
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-ui.cjs'
      - 'data/photos-manifest.json'
      - '.github/workflows/verify-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-fruit-ui
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-save --no-package-lock jsdom@26.1.0
      - run: node scripts/check-ui.cjs
      - name: Save UI test report
        if: always()
        run: |
          if [ -f data/ui-check-report.json ]; then
            git config user.name "fruit-qa-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/ui-check-report.json
            if ! git diff --cached --quiet; then
              git commit -m "qa: save fruit laboratory UI smoke tests"
              git pull --rebase
              git push
            fi
          fi
