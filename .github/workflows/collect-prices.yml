name: Collect fruit prices
on:
  schedule:
    - cron: '7 3,9,15,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-fruit-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/collect-prices.mjs
      - name: Commit public observations
        run: |
          git config user.name "fruit-price-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update official fruit price snapshots"
            git push
          fi
