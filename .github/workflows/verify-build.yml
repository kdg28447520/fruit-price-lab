name: Verify production static output
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-static.cjs'
      - 'scripts/check-build.cjs'
      - 'vercel.json'
      - 'index.html'
      - 'public/**'
      - '.github/workflows/verify-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build-static.cjs
      - run: node scripts/check-build.cjs
      - name: Publish build check
        if: always()
        run: |
          if [ -f data/build-check-report.json ]; then
            git config user.name "fruit-qa-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/build-check-report.json
            if ! git diff --cached --quiet; then
              git commit -m "qa: verify SEO and complete static output"
              git pull --rebase
              git push
            fi
          fi
